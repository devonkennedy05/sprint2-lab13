# PaySprint Merchant Portal - production configuration (excerpt)

management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS

server.error.include-stacktrace=always
server.error.include-message=always

# Shared secret used to verify HMAC signatures on inbound payment-status webhooks.
# Override via env var WEBHOOK_PAYMENT_STATUS_SIGNING_SECRET; never commit real secrets.
webhook.payment-status.signing-secret=${WEBHOOK_PAYMENT_STATUS_SIGNING_SECRET:}
